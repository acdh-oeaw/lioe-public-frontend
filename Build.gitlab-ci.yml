variables:
  AUTO_BUILD_IMAGE_VERSION: "v4.13.0"

build:
  stage: build
  image: "${CI_TEMPLATE_REGISTRY_HOST}/gitlab-org/cluster-integration/auto-build-image:${AUTO_BUILD_IMAGE_VERSION}"
  variables:
    DOCKER_TLS_CERTDIR: ""
  services:
    - name: "docker:28-dind"
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  environment:
    name: $BUILD_ENV
    action: prepare
  script:
    - |
      if [[ -z "$CI_COMMIT_TAG" ]]; then
        export CI_APPLICATION_REPOSITORY=$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
        export CI_APPLICATION_TAG=$CI_COMMIT_SHA
      else
        export CI_APPLICATION_REPOSITORY=$CI_REGISTRY_IMAGE
        export CI_APPLICATION_TAG=$CI_COMMIT_TAG
      fi
    - /build/build.sh
  artifacts:
    reports:
      dotenv: gl-auto-build-variables.env
  rules:
    - if: "$BUILD_DISABLED"
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        BUILD_ENV: "review/main"
    - if: "$CI_COMMIT_TAG || $CI_COMMIT_BRANCH"
      variables:
        BUILD_ENV: "development"